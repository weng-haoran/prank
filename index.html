<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灵魂拷问</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff7e6 0%, #ffe9c9 50%, #ffd9a8 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: min(480px, 94vw);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(180, 110, 30, 0.25);
    padding: 44px 36px 38px;
    text-align: center;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: 26px;
    color: #4a3000;
    line-height: 1.6;
    margin-bottom: 34px;
    font-weight: 800;
  }
  .coin {
    width: 76px; height: 76px; margin: 0 auto 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe08a, #f0a500 70%, #c07f00);
    border: 5px solid #a86e00;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: #a86e00;
    box-shadow: 0 8px 20px rgba(200, 140, 20, 0.5);
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  .btns { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }
  .btn {
    flex: 1; max-width: 150px;
    padding: 16px 0;
    font-size: 18px; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer;
    color: #fff; letter-spacing: 4px;
    transition: transform 0.12s, filter 0.2s;
  }
  .btn:active { transform: scale(0.94); }
  #yesBtn { background: linear-gradient(180deg, #37c45a, #1fa83d); box-shadow: 0 6px 16px rgba(31,168,61,0.4); }
  #yesBtn:hover { filter: brightness(1.08); }
  #noBtn { background: linear-gradient(180deg, #f05b5b, #d03030); box-shadow: 0 6px 16px rgba(208,48,48,0.4); }
  #noBtn:hover { filter: brightness(1.08); }

  .taunt {
    min-height: 22px;
    font-size: 14px; color: #c97b00;
    font-weight: 600;
  }

  /* ===== 付款页 ===== */
  #pay h1 { margin-bottom: 12px; }
  #pay .pay-sub { font-size: 15px; color: #8a6a2a; margin-bottom: 26px; }
  #qrBox, #qrBoxAli {
    width: 200px; margin: 0 auto 12px;
    background: #fff; border: 8px solid #fff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(180,110,30,0.3);
    overflow: hidden;
    cursor: pointer;
  }
  #qrBox img, #qrBoxAli img { display: block; width: 100%; height: auto; }
  .qr-label {
    font-size: 13px; color: #c97b00; font-weight: 600;
    margin-bottom: 14px;
  }
  #pay .tip { font-size: 13px; color: #a08050; line-height: 1.9; }
  #pay .note { font-size: 12px; color: #c0a678; margin-top: 16px; }
  #restartBtn {
    margin-top: 22px; padding: 11px 34px;
    font-size: 14px; font-weight: 600;
    background: #f0a500; color: #fff;
    border: none; border-radius: 10px; cursor: pointer;
  }
  #restartBtn:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div id="question" class="card">
  <div class="coin">¥</div>
  <h1 id="qText">你愿意给我1000块钱吗？</h1>
  <div class="btns">
    <button class="btn" id="yesBtn">愿意</button>
    <button class="btn" id="noBtn">不愿意</button>
  </div>
  <div class="taunt" id="taunt"></div>
</div>

<script>
(function () {
  'use strict';

  var amounts = [1000, 500, 100];
  var idx = 0;
  var refused = 0;

  var qText = document.getElementById('qText');
  var taunt = document.getElementById('taunt');
  var question = document.getElementById('question');
  var pay = document.getElementById('pay');

  var taunts = [
    '狠心！第 {n} 次拒绝，你的良心不会痛吗？',
    '又拒绝！第 {n} 次了，友谊小船要翻了！',
    '第 {n} 次！我连100块都不配吗？',
    '第 {n} 次拒绝，你确定？再想想？',
    '第 {n} 次！我都降价了你还不愿意？'
  ];

  function showQ() {
    question.classList.remove('hidden');
    pay.classList.add('hidden');
    qText.textContent = '你愿意给我' + amounts[idx] + '块钱吗？';
    if (refused > 0) {
      taunt.textContent = taunts[refused % taunts.length].replace('{n}', refused);
    } else {
      taunt.textContent = '';
    }
  }

  document.getElementById('noBtn').addEventListener('click', function () {
    refused++;
    idx = (idx + 1) % amounts.length;
    showQ();
  });

  var qrBox = document.getElementById('qrBox');
  var qrBoxAli = document.getElementById('qrBoxAli');
  var qrLabel = document.getElementById('qrLabel');
  var showWx = true;

  function toggleQr() {
    showWx = !showWx;
    qrBox.style.display = showWx ? 'block' : 'none';
    qrBoxAli.style.display = showWx ? 'none' : 'block';
    qrLabel.textContent = (showWx ? '微信' : '支付宝') + '收款码 · 点击切换';
  }

  document.getElementById('yesBtn').addEventListener('click', function () {
    question.classList.add('hidden');
    pay.classList.remove('hidden');
    // 默认显示微信收款码
    showWx = true;
    qrBox.style.display = 'block';
    qrBoxAli.style.display = 'none';
    qrLabel.textContent = '微信收款码 · 点击切换';
  });

  // 点击收款码本身，在 微信 / 支付宝 之间变换
  document.getElementById('pay').addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && (t.closest('#qrBox') || t.closest('#qrBoxAli'))) {
      toggleQr();
    }
  });

  document.getElementById('restartBtn').addEventListener('click', function () {
    refused = 0;
    idx = 0;
    showQ();
  });
})();
</script>
